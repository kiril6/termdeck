name: e2e

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:   # publish.yml runs this before publishing

permissions:
  contents: read

jobs:
  browser:
    # Linux runs every test in Chromium, Firefox and WebKit (Safari's engine); macOS runs Chromium for the mac paths.
    # Linux runs inside the official Playwright image: browsers and their system libraries come preinstalled, so the
    # job skips `install --with-deps`, whose apt download once took 38 min on a slow Ubuntu mirror. Keep the image tag
    # on the lockfile's Playwright version.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browsers: chromium firefox webkit, all: '1' }
          - { os: macos-latest, browsers: chromium, all: '' }
    runs-on: ${{ matrix.os }}
    container:
      # not a matrix key: one would rename the job, and the ruleset requires its name. Empty on macOS: runs on the host.
      image: ${{ matrix.os == 'ubuntu-latest' && 'mcr.microsoft.com/playwright:v1.64.1-noble' || '' }}
      options: --user 1001         # the runner's user, so Firefox accepts the mounted HOME
    timeout-minutes: 40   # Linux runs the whole suite in 3 browsers, one worker: ~20 min and growing
    env:
      PW_ALL_BROWSERS: ${{ matrix.all }}
      SHELL: /bin/bash   # the container sets none; the terminals under test spawn $SHELL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Lockfile install, as `npx @kiril6/termdeck` users get (both node-pty variants are optional dependencies).
      - run: npm ci
      - name: node-pty loads
        run: node -e "try { require('node-pty') } catch { require('@homebridge/node-pty-prebuilt-multiarch') }"
      # a no-op in the container while its tag matches the lockfile; after a Playwright bump it fetches just the browsers
      - run: npx playwright install ${{ matrix.browsers }}
      - run: npm test
      - if: failure()   # trace + screenshot of each failed test (throwaway HOME and token, nothing real)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.os }}
          path: test-results/
          retention-days: 7
