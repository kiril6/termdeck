name: e2e

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node install.js
      - run: npx playwright install --with-deps chromium
      - run: npm test
