name: e2e

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:   # publish.yml runs this before publishing

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: node install.js
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()   # trace + screenshot of each failed test (throwaway HOME and token, nothing real)
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 7
