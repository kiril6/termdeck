name: smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node install.js
      - run: node -c server.js
      - run: node server.js --version
      - run: node server.js --help
      - run: node scripts/check-hooks-docs.js
      - run: node scripts/check-hooks.js
      - run: node scripts/check-rules.js
      - run: node scripts/check-usage.js
      - run: node server.js autostart install --dry-run
      - run: test "$(node server.js --bogus >/dev/null 2>&1; echo $?)" = 2
