name: smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:   # publish.yml runs this before publishing

permissions:
  contents: read

defaults:
  run:
    shell: bash   # same scripts on every OS (Git Bash on Windows)

jobs:
  check:
    # Node: the engines floor (20 — the Linux node-pty build needs it) and the current LTS lines; macOS for the mac-only paths (launchd, spawn-helper, lsof).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
        include:
          - { os: macos-latest, node: '22' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - if: runner.os == 'Linux'   # tmux.test.js needs it (skips without)
        run: command -v tmux || (sudo apt-get update -q && sudo apt-get install -y -q tmux)
      - run: node install.js
      - run: node -c server.js
      - run: node server.js --version
      - run: node server.js --help
      - run: node scripts/check-hooks-docs.js
      - run: node scripts/check-hooks.js
      - run: node scripts/hooks.test.js
      - run: node scripts/notify.test.js
      - run: node scripts/buffer.test.js
      - run: node scripts/output.test.js
      - run: node scripts/access.test.js
      - run: node scripts/secret-race.test.js
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/update-check.test.js
      - run: node scripts/check-rules.js
      - run: node scripts/json-store.test.js
      - run: node scripts/shared-home.test.js
      - run: node scripts/check-usage.js
      - run: node scripts/check-pack.js
      - run: node scripts/uninstall.test.js
      - run: node scripts/approval.test.js
      - run: node scripts/finish.test.js
      - run: node scripts/tmux.test.js
      - run: node server.js autostart install --dry-run
      - run: test "$(node server.js --bogus >/dev/null 2>&1; echo $?)" = 2

  windows:
    # Best-effort platform (README "Known limits"): install, CLI, the platform-neutral checks, and a real PTY spawn.
    # The rest of the suite drives bash, tmux and POSIX signals.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node install.js
      - run: node -c server.js
      - run: node server.js --version
      - run: node server.js --help
      - run: node -e "const p=require('node-pty').spawn('powershell.exe',['-NoProfile','-Command','exit 0'],{});p.onExit(({exitCode})=>{console.log('pty exit',exitCode);process.exit(exitCode)})"
      - run: node scripts/check-hooks-docs.js
      - run: node scripts/check-hooks.js
      - run: node scripts/hooks.test.js
      - run: node scripts/notify.test.js
      - run: node scripts/check-rules.js
      - run: node scripts/json-store.test.js
      - run: node scripts/secret-race.test.js
      - run: node scripts/check-usage.js
      - run: node scripts/check-pack.js
      - run: test "$(node server.js --bogus >/dev/null 2>&1; echo $?)" = 2
