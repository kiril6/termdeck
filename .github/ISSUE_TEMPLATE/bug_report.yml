name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please fill in enough for someone to reproduce it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
      placeholder: Shells fail to start / a window won't tile / ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm start
        2. Open a terminal in project X
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of termdeck does this touch?
      options:
        - Terminals / PTY & shells
        - Windows, tiling & resize
        - Projects & sidebar
        - Command palette & search
        - AI CLI presets & agent watch
        - tmux / reattach durability
        - SSH hosts
        - Snippets
        - Themes & UI
        - npx / install / setup
        - Docs / landing page
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: termdeck version
      description: The release tag, or the commit if you run from source.
      placeholder: v1.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node -v`
      placeholder: v20.11.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: termdeck doctor
      description: Output of `termdeck doctor` (or `node server.js doctor` from a clone). It contains no secret; remove any path you'd rather not share.
      render: text
    validations:
      required: false
  - type: textarea
    id: debug
    attributes:
      label: /debug output (if shells fail to start)
      description: Paste the output from http://localhost:3000/debug
      render: text
    validations:
      required: false
